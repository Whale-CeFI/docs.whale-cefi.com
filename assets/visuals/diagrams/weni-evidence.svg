<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">WENI Evidence View</title>
  <desc id="desc">An answer exposes its sources, timestamps, conflicts, confidence, and unresolved uncertainty.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10232D" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061018"/>
      <stop offset="1" stop-color="#081A24"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2F93A8"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".42"/>
  <circle cx="1440" cy="80" r="180" fill="#2F93A8" opacity=".07" filter="url(#soft)"/>
  <g>
    <text x="90" y="82" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3">SYSTEM VIEW / WENI-EVIDENCE</text>
    <text x="90" y="150" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="650">WENI Evidence View</text>
    <text x="90" y="192" fill="#91A6AF" font-family="Inter, Arial, sans-serif" font-size="20">An answer exposes its sources, timestamps, conflicts, confidence, and unresolved uncertainty.</text>
    <line x1="90" y1="222" x2="1510" y2="222" stroke="#34505C" stroke-width="1"/>
  </g>
  <rect x="180" y="285" width="1240" height="450" rx="22" fill="#0B1B25" stroke="#34505C"/><text x="225" y="330" fill="#91A6AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">01</text>
      <text x="280" y="330" text-anchor="start" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Answer</text>
      <line x1="620" y1="323" x2="1325" y2="323" stroke="#10232D" stroke-width="14" stroke-linecap="round"/>
      <line x1="620" y1="323" x2="817.4" y2="323" stroke="#EAF1F3" stroke-width="8" stroke-linecap="round"/><text x="225" y="394" fill="#91A6AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">02</text>
      <text x="280" y="394" text-anchor="start" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Primary sources</text>
      <line x1="620" y1="387" x2="1325" y2="387" stroke="#10232D" stroke-width="14" stroke-linecap="round"/>
      <line x1="620" y1="387" x2="894.95" y2="387" stroke="#69D2E7" stroke-width="8" stroke-linecap="round"/><text x="225" y="458" fill="#91A6AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">03</text>
      <text x="280" y="458" text-anchor="start" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Freshness</text>
      <line x1="620" y1="451" x2="1325" y2="451" stroke="#10232D" stroke-width="14" stroke-linecap="round"/>
      <line x1="620" y1="451" x2="972.5" y2="451" stroke="#69D2E7" stroke-width="8" stroke-linecap="round"/><text x="225" y="522" fill="#91A6AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">04</text>
      <text x="280" y="522" text-anchor="start" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Conflicts</text>
      <line x1="620" y1="515" x2="1325" y2="515" stroke="#10232D" stroke-width="14" stroke-linecap="round"/>
      <line x1="620" y1="515" x2="1050.0500000000002" y2="515" stroke="#69D2E7" stroke-width="8" stroke-linecap="round"/><text x="225" y="586" fill="#91A6AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">05</text>
      <text x="280" y="586" text-anchor="start" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Confidence</text>
      <line x1="620" y1="579" x2="1325" y2="579" stroke="#10232D" stroke-width="14" stroke-linecap="round"/>
      <line x1="620" y1="579" x2="1127.6" y2="579" stroke="#69D2E7" stroke-width="8" stroke-linecap="round"/><text x="225" y="650" fill="#91A6AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">06</text>
      <text x="280" y="650" text-anchor="start" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Uncertainty</text>
      <line x1="620" y1="643" x2="1325" y2="643" stroke="#10232D" stroke-width="14" stroke-linecap="round"/>
      <line x1="620" y1="643" x2="1205.15" y2="643" stroke="#D7A75F" stroke-width="8" stroke-linecap="round"/>
  <line x1="90" y1="842" x2="1510" y2="842" stroke="#34505C" stroke-width="1"/>
  <text x="90" y="872" fill="#91A6AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.8">DOCUMENTATION VISUAL / HUMAN-READABLE / SOURCE-BOUND</text>
</svg>