<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="btct-title btct-desc">
  <title id="btct-title">Operation BLACK TIDE containment timeline</title>
  <desc id="btct-desc">The isolated scenario from session replay at T plus zero through evidence-chain verification at T plus ninety, with containment states and a 22-event hash chain.</desc>
  <defs>
    <pattern id="btct-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#10232D" stroke-width="1"/>
