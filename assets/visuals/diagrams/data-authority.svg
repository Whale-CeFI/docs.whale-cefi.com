    <text x="90" y="150" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="650">Data Authority Matrix</text>
    <text x="90" y="192" fill="#91A6AF" font-family="Inter, Arial, sans-serif" font-size="20">Each fact has one authoritative store, controlled derivatives, and an explicit recovery rule.</text>
    <line x1="90" y1="222" x2="1510" y2="222" stroke="#34505C" stroke-width="1"/>
  </g>
