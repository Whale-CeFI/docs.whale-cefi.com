<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Custody Authorization</title>
  <desc id="desc">No single operator, service, or intelligence process can independently move assets.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10232D" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061018"/>
      <stop offset="1" stop-color="#081A24"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2F93A8"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".42"/>
  <circle cx="1440" cy="80" r="180" fill="#2F93A8" opacity=".07" filter="url(#soft)"/>
  <g>
    <text x="90" y="82" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3">SYSTEM VIEW / CUSTODY-AUTHORIZATION</text>
    <text x="90" y="150" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="650">Custody Authorization</text>
    <text x="90" y="192" fill="#91A6AF" font-family="Inter, Arial, sans-serif" font-size="20">No single operator, service, or intelligence process can independently move assets.</text>
    <line x1="90" y1="222" x2="1510" y2="222" stroke="#34505C" stroke-width="1"/>
  </g>
  <g>
    <rect x="100" y="300" width="410" height="105" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="100" y="300" width="5" height="105" rx="2.5" fill="#69D2E7"/>
    <text x="122" y="331" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">01</text>
    <text x="305" y="359.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">User or treasury intent</text>
  </g><path d="M 510 352 L 690 520" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><g>
    <rect x="100" y="455" width="410" height="105" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="100" y="455" width="5" height="105" rx="2.5" fill="#69D2E7"/>
    <text x="122" y="486" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">02</text>
    <text x="305" y="514.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Policy engine</text>
  </g><path d="M 510 507 L 690 520" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><g>
    <rect x="100" y="610" width="410" height="105" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="100" y="610" width="5" height="105" rx="2.5" fill="#69D2E7"/>
    <text x="122" y="641" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">03</text>
    <text x="305" y="669.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Independent approver</text>
  </g><path d="M 510 662 L 690 520" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><circle cx="800" cy="520" r="115" fill="#102733" stroke="#D7A75F" stroke-width="3"/>
    <text x="800" y="510" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">Threshold approval</text><g>
    <rect x="1090" y="300" width="410" height="105" rx="14" fill="#0B1B25" stroke="#D7A75F" stroke-width="2"/>
    <rect x="1090" y="300" width="5" height="105" rx="2.5" fill="#D7A75F"/>
    <text x="1112" y="331" fill="#D7A75F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">01</text>
    <text x="1295" y="359.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">MPC quorum</text>
  </g><path d="M 915 520 L 1090 352" stroke="#D7A75F" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><g>
    <rect x="1090" y="455" width="410" height="105" rx="14" fill="#0B1B25" stroke="#D7A75F" stroke-width="2"/>
    <rect x="1090" y="455" width="5" height="105" rx="2.5" fill="#D7A75F"/>
    <text x="1112" y="486" fill="#D7A75F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">02</text>
    <text x="1295" y="514.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Signed payload</text>
  </g><path d="M 915 520 L 1090 507" stroke="#D7A75F" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><g>
    <rect x="1090" y="610" width="410" height="105" rx="14" fill="#0B1B25" stroke="#7BC2A5" stroke-width="2"/>
    <rect x="1090" y="610" width="5" height="105" rx="2.5" fill="#7BC2A5"/>
    <text x="1112" y="641" fill="#7BC2A5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">03</text>
    <text x="1295" y="669.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Network broadcast</text>
  </g><path d="M 915 520 L 1090 662" stroke="#D7A75F" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/>
  <line x1="90" y1="842" x2="1510" y2="842" stroke="#34505C" stroke-width="1"/>
  <text x="90" y="872" fill="#91A6AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.8">DOCUMENTATION VISUAL / HUMAN-READABLE / SOURCE-BOUND</text>
</svg>