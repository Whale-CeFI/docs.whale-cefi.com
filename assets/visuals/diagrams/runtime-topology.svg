    <text x="172" y="316" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">01</text>
    <text x="800" y="331" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Edge and identity</text>
  </g><g>
    <rect x="195" y="383" width="1210" height="78" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="195" y="383" width="5" height="78" rx="2.5" fill="#69D2E7"/>
    <text x="217" y="414" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">02</text>
    <text x="800" y="429" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Product services</text>
  </g><g>
    <rect x="240" y="481" width="1120" height="78" rx="14" fill="#0B1B25" stroke="#2F93A8" stroke-width="2"/>
    <rect x="240" y="481" width="5" height="78" rx="2.5" fill="#2F93A8"/>
    <text x="262" y="512" fill="#2F93A8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">03</text>
    <text x="800" y="527" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Financial authority</text>
  </g><g>
    <rect x="285" y="579" width="1030" height="78" rx="14" fill="#0B1B25" stroke="#2F93A8" stroke-width="2"/>
    <rect x="285" y="579" width="5" height="78" rx="2.5" fill="#2F93A8"/>
    <text x="307" y="610" fill="#2F93A8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">04</text>
    <text x="800" y="625" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Custody and chain</text>
  </g><g>
    <rect x="330" y="677" width="940" height="78" rx="14" fill="#0B1B25" stroke="#7BC2A5" stroke-width="2"/>
