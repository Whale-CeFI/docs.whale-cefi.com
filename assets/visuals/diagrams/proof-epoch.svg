<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Proof Epoch</title>
  <desc id="desc">Liabilities, reserves, encumbrances, and wallet authority resolve to the same observation time.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10232D" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061018"/>
      <stop offset="1" stop-color="#081A24"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2F93A8"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".42"/>
  <circle cx="1440" cy="80" r="180" fill="#2F93A8" opacity=".07" filter="url(#soft)"/>
  <g>
    <text x="90" y="82" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3">SYSTEM VIEW / PROOF-EPOCH</text>
    <text x="90" y="150" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="650">Proof Epoch</text>
    <text x="90" y="192" fill="#91A6AF" font-family="Inter, Arial, sans-serif" font-size="20">Liabilities, reserves, encumbrances, and wallet authority resolve to the same observation time.</text>
    <line x1="90" y1="222" x2="1510" y2="222" stroke="#34505C" stroke-width="1"/>
  </g>
  <circle cx="800" cy="520" r="142" fill="#102733" stroke="#7BC2A5" stroke-width="3"/>
  <text x="800" y="512" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">Epoch commitment</text><g>
    <rect x="625" y="225" width="350" height="100" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="625" y="225" width="5" height="100" rx="2.5" fill="#69D2E7"/>
    <text x="647" y="256" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">01</text>
    <text x="800" y="282" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Liability snapshot</text>
  </g><path d="M 800 325 L 800 375" stroke="#2F93A8" stroke-width="2.5" fill="none" stroke-dasharray="8 8" marker-end="url(#arrow)"/><g>
    <rect x="1145" y="470" width="350" height="100" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="1145" y="470" width="5" height="100" rx="2.5" fill="#69D2E7"/>
    <text x="1167" y="501" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">02</text>
    <text x="1320" y="527" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Reserve snapshot</text>
  </g><path d="M 1145 520 L 945 520" stroke="#2F93A8" stroke-width="2.5" fill="none" stroke-dasharray="8 8" marker-end="url(#arrow)"/><g>
    <rect x="625" y="715" width="350" height="100" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="625" y="715" width="5" height="100" rx="2.5" fill="#69D2E7"/>
    <text x="647" y="746" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">03</text>
    <text x="800" y="772" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Encumbrances</text>
  </g><path d="M 800 715 L 800 665" stroke="#2F93A8" stroke-width="2.5" fill="none" stroke-dasharray="8 8" marker-end="url(#arrow)"/><g>
    <rect x="105" y="470" width="350" height="100" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="105" y="470" width="5" height="100" rx="2.5" fill="#69D2E7"/>
    <text x="127" y="501" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">04</text>
    <text x="280" y="527" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Authority proof</text>
  </g><path d="M 455 520 L 655 520" stroke="#2F93A8" stroke-width="2.5" fill="none" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <line x1="90" y1="842" x2="1510" y2="842" stroke="#34505C" stroke-width="1"/>
  <text x="90" y="872" fill="#91A6AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.8">DOCUMENTATION VISUAL / HUMAN-READABLE / SOURCE-BOUND</text>
</svg>