<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Position Statement</title>
  <desc id="desc">Principal, accrued reward, postings, product version, and settlement evidence remain separable.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10232D" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061018"/>
      <stop offset="1" stop-color="#081A24"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2F93A8"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".42"/>
  <circle cx="1440" cy="80" r="180" fill="#2F93A8" opacity=".07" filter="url(#soft)"/>
  <g>
    <text x="90" y="82" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3">SYSTEM VIEW / POSITION-STATEMENT</text>
    <text x="90" y="150" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="650">Position Statement</text>
    <text x="90" y="192" fill="#91A6AF" font-family="Inter, Arial, sans-serif" font-size="20">Principal, accrued reward, postings, product version, and settlement evidence remain separable.</text>
    <line x1="90" y1="222" x2="1510" y2="222" stroke="#34505C" stroke-width="1"/>
  </g>
  <rect x="180" y="270" width="1240" height="480" rx="22" fill="#0B1B25" stroke="#2F93A8" stroke-width="2"/>
    <line x1="720" y1="270" x2="720" y2="750" stroke="#34505C"/>
    <text x="225" y="325" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2">POSITION RECORD</text>
    <text x="765" y="325" fill="#D7A75F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2">EVIDENCE RECORD</text><circle cx="235" cy="369" r="6" fill="#69D2E7"/>
      <text x="260" y="375" text-anchor="start" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">Opening principal</text>
      <line x1="260" y1="420" x2="725" y2="420" stroke="#34505C"/><circle cx="235" cy="479" r="6" fill="#69D2E7"/>
      <text x="260" y="485" text-anchor="start" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">Daily accrual</text>
      <line x1="260" y1="530" x2="725" y2="530" stroke="#34505C"/><circle cx="235" cy="589" r="6" fill="#69D2E7"/>
      <text x="260" y="595" text-anchor="start" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">Adjustments</text>
      <line x1="260" y1="640" x2="725" y2="640" stroke="#34505C"/><circle cx="775" cy="369" r="6" fill="#D7A75F"/>
      <text x="800" y="375" text-anchor="start" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">Available reward</text>
      <line x1="800" y1="420" x2="1265" y2="420" stroke="#34505C"/><circle cx="775" cy="479" r="6" fill="#D7A75F"/>
      <text x="800" y="485" text-anchor="start" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">Maturity value</text>
      <line x1="800" y1="530" x2="1265" y2="530" stroke="#34505C"/><circle cx="775" cy="589" r="6" fill="#D7A75F"/>
      <text x="800" y="595" text-anchor="start" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">Evidence links</text>
      <line x1="800" y1="640" x2="1265" y2="640" stroke="#34505C"/>
  <line x1="90" y1="842" x2="1510" y2="842" stroke="#34505C" stroke-width="1"/>
  <text x="90" y="872" fill="#91A6AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.8">DOCUMENTATION VISUAL / HUMAN-READABLE / SOURCE-BOUND</text>
</svg>