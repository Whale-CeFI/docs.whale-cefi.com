<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Reward-Source Isolation</title>
  <desc id="desc">Realized income, incentives, and coverage enter through separate controlled accounts.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10232D" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061018"/>
      <stop offset="1" stop-color="#081A24"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2F93A8"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".42"/>
  <circle cx="1440" cy="80" r="180" fill="#2F93A8" opacity=".07" filter="url(#soft)"/>
  <g>
    <text x="90" y="82" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3">SYSTEM VIEW / REWARD-SOURCE-ISOLATION</text>
    <text x="90" y="150" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="650">Reward-Source Isolation</text>
    <text x="90" y="192" fill="#91A6AF" font-family="Inter, Arial, sans-serif" font-size="20">Realized income, incentives, and coverage enter through separate controlled accounts.</text>
    <line x1="90" y1="222" x2="1510" y2="222" stroke="#34505C" stroke-width="1"/>
  </g>
  <g>
    <rect x="80" y="300" width="360" height="105" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="80" y="300" width="5" height="105" rx="2.5" fill="#69D2E7"/>
    <text x="102" y="331" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">01</text>
    <text x="260" y="359.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Realized external income</text>
  </g><path d="M 260 405 C 260 530, 650 540, 760 620" stroke="#69D2E7" stroke-width="7" fill="none" opacity=".75"/><g>
    <rect x="440" y="300" width="360" height="105" rx="14" fill="#0B1B25" stroke="#D7A75F" stroke-width="2"/>
    <rect x="440" y="300" width="5" height="105" rx="2.5" fill="#D7A75F"/>
    <text x="462" y="331" fill="#D7A75F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">02</text>
    <text x="620" y="359.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Pre-funded incentive</text>
  </g><path d="M 620 405 C 620 530, 725 540, 760 620" stroke="#D7A75F" stroke-width="7" fill="none" opacity=".75"/><g>
    <rect x="800" y="300" width="360" height="105" rx="14" fill="#0B1B25" stroke="#7BC2A5" stroke-width="2"/>
    <rect x="800" y="300" width="5" height="105" rx="2.5" fill="#7BC2A5"/>
    <text x="822" y="331" fill="#7BC2A5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">03</text>
    <text x="980" y="359.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Committed coverage</text>
  </g><path d="M 980 405 C 980 530, 800 540, 760 620" stroke="#7BC2A5" stroke-width="7" fill="none" opacity=".75"/><g>
    <rect x="570" y="620" width="460" height="112" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="570" y="620" width="5" height="112" rx="2.5" fill="#69D2E7"/>
    
    <text x="800" y="683" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Reward liability</text>
  </g><path d="M 150 760 H 1450" stroke="#D56A6A" stroke-width="3" stroke-dasharray="12 10"/>
    <text x="800" y="805" text-anchor="middle" fill="#D56A6A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2">CUSTOMER PRINCIPAL REMAINS OUTSIDE THE FUNDING PATH</text>
  <line x1="90" y1="842" x2="1510" y2="842" stroke="#34505C" stroke-width="1"/>
  <text x="90" y="872" fill="#91A6AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.8">DOCUMENTATION VISUAL / HUMAN-READABLE / SOURCE-BOUND</text>
</svg>