  </g><path d="M 1230 362 L 1230 392" stroke="#D7A75F" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><g>
    <rect x="970" y="392" width="520" height="82" rx="14" fill="#0B1B25" stroke="#D7A75F" stroke-width="2"/>
    <rect x="970" y="392" width="5" height="82" rx="2.5" fill="#D7A75F"/>
    <text x="992" y="423" fill="#D7A75F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">02</text>
    <text x="1230" y="440" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Independent policy</text>
  </g><path d="M 1230 474 L 1230 504" stroke="#D7A75F" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><g>
    <rect x="970" y="504" width="520" height="82" rx="14" fill="#0B1B25" stroke="#D7A75F" stroke-width="2"/>
    <rect x="970" y="504" width="5" height="82" rx="2.5" fill="#D7A75F"/>
    <text x="992" y="535" fill="#D7A75F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">03</text>
    <text x="1230" y="552" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">External signature</text>
  </g><path d="M 1230 586 L 1230 616" stroke="#D7A75F" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><g>
    <rect x="970" y="616" width="520" height="82" rx="14" fill="#0B1B25" stroke="#D7A75F" stroke-width="2"/>
    <rect x="970" y="616" width="5" height="82" rx="2.5" fill="#D7A75F"/>
    <text x="992" y="647" fill="#D7A75F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">04</text>
    <text x="1230" y="664" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Broadcast</text>
  </g><path d="M 630 516 L 760 516" stroke="#D56A6A" stroke-width="2.5" fill="none" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <line x1="90" y1="842" x2="1510" y2="842" stroke="#34505C" stroke-width="1"/>
  <text x="90" y="872" fill="#91A6AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.8">DOCUMENTATION VISUAL / HUMAN-READABLE / SOURCE-BOUND</text>
