    <rect x="110" y="392" width="5" height="82" rx="2.5" fill="#69D2E7"/>
    <text x="132" y="423" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">02</text>
    <text x="370" y="440" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Reasoning</text>
  </g><path d="M 370 474 L 370 504" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><g>
