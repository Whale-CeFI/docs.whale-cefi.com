<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ordered Yield Waterfall</title>
  <desc id="desc">Realized income absorbs losses, costs, and safety requirements before reward and residual revenue.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10232D" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061018"/>
      <stop offset="1" stop-color="#081A24"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2F93A8"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".42"/>
  <circle cx="1440" cy="80" r="180" fill="#2F93A8" opacity=".07" filter="url(#soft)"/>
  <g>
    <text x="90" y="82" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3">SYSTEM VIEW / YIELD-WATERFALL</text>
    <text x="90" y="150" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="650">Ordered Yield Waterfall</text>
    <text x="90" y="192" fill="#91A6AF" font-family="Inter, Arial, sans-serif" font-size="20">Realized income absorbs losses, costs, and safety requirements before reward and residual revenue.</text>
    <line x1="90" y1="222" x2="1510" y2="222" stroke="#34505C" stroke-width="1"/>
  </g>
  <rect x="180" y="290" width="192.66666666666666" height="340" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
      <text x="276.3333333333333" y="345" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Realized income</text>
      <line x1="283.3333333333333" y1="400" x2="283.3333333333333" y2="560" stroke="#69D2E7" stroke-width="8" stroke-linecap="round" opacity=".7"/><path d="M 372.66666666666663 460 L 386.66666666666663 536" stroke="#69D2E7" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="386.66666666666663" y="366" width="192.66666666666666" height="302" rx="14" fill="#0B1B25" stroke="#D7A75F" stroke-width="2"/>
      <text x="482.99999999999994" y="421" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Losses and</text><text x="482.99999999999994" y="446" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">reversals</text>
      <line x1="489.99999999999994" y1="476" x2="489.99999999999994" y2="612" stroke="#D7A75F" stroke-width="8" stroke-linecap="round" opacity=".7"/><path d="M 579.3333333333333 536 L 593.3333333333333 612" stroke="#D7A75F" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="593.3333333333333" y="442" width="192.66666666666666" height="264" rx="14" fill="#0B1B25" stroke="#D7A75F" stroke-width="2"/>
      <text x="689.6666666666666" y="497" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Direct costs</text>
      <line x1="696.6666666666666" y1="552" x2="696.6666666666666" y2="664" stroke="#D7A75F" stroke-width="8" stroke-linecap="round" opacity=".7"/><path d="M 785.9999999999999 612 L 799.9999999999999 688" stroke="#D7A75F" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="800" y="518" width="192.66666666666666" height="226" rx="14" fill="#0B1B25" stroke="#D7A75F" stroke-width="2"/>
      <text x="896.3333333333334" y="573" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Safety buffers</text>
      <line x1="903.3333333333334" y1="628" x2="903.3333333333334" y2="716" stroke="#D7A75F" stroke-width="8" stroke-linecap="round" opacity=".7"/><path d="M 992.6666666666666 688 L 1006.6666666666666 764" stroke="#D7A75F" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="1006.6666666666666" y="594" width="192.66666666666666" height="188" rx="14" fill="#0B1B25" stroke="#D7A75F" stroke-width="2"/>
      <text x="1103" y="649" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">User rewards</text>
      <line x1="1110" y1="704" x2="1110" y2="768" stroke="#D7A75F" stroke-width="8" stroke-linecap="round" opacity=".7"/><path d="M 1199.3333333333333 764 L 1213.3333333333333 840" stroke="#D7A75F" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="1213.3333333333333" y="670" width="192.66666666666666" height="150" rx="14" fill="#0B1B25" stroke="#7BC2A5" stroke-width="2"/>
      <text x="1309.6666666666665" y="725" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Residual revenue</text>
      <line x1="1316.6666666666665" y1="780" x2="1316.6666666666665" y2="820" stroke="#7BC2A5" stroke-width="8" stroke-linecap="round" opacity=".7"/>
  <line x1="90" y1="842" x2="1510" y2="842" stroke="#34505C" stroke-width="1"/>
  <text x="90" y="872" fill="#91A6AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.8">DOCUMENTATION VISUAL / HUMAN-READABLE / SOURCE-BOUND</text>
</svg>