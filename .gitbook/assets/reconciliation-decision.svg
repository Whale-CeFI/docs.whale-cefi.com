<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Reconciliation Decision</title>
  <desc id="desc">Ledger obligations, custody inventory, and blockchain state resolve to a match or a scoped exception.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10232D" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061018"/>
      <stop offset="1" stop-color="#081A24"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2F93A8"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".42"/>
  <circle cx="1440" cy="80" r="180" fill="#2F93A8" opacity=".07" filter="url(#soft)"/>
  <g>
    <text x="90" y="82" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3">SYSTEM VIEW / RECONCILIATION-DECISION</text>
    <text x="90" y="150" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="650">Reconciliation Decision</text>
    <text x="90" y="192" fill="#91A6AF" font-family="Inter, Arial, sans-serif" font-size="20">Ledger obligations, custody inventory, and blockchain state resolve to a match or a scoped exception.</text>
    <line x1="90" y1="222" x2="1510" y2="222" stroke="#34505C" stroke-width="1"/>
  </g>
  <path d="M 800 385 L 340 620" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M 340 700 L 1260 700" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M 1260 620 L 840 385" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><g>
    <rect x="590" y="285" width="420" height="110" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="590" y="285" width="5" height="110" rx="2.5" fill="#69D2E7"/>
    <text x="612" y="316" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">01</text>
    <text x="800" y="347" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Ledger obligations</text>
  </g><g>
    <rect x="50" y="620" width="420" height="110" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="50" y="620" width="5" height="110" rx="2.5" fill="#69D2E7"/>
    <text x="72" y="651" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">02</text>
    <text x="260" y="682" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Custody inventory</text>
  </g><g>
    <rect x="1130" y="620" width="420" height="110" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="1130" y="620" width="5" height="110" rx="2.5" fill="#69D2E7"/>
    <text x="1152" y="651" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">03</text>
    <text x="1340" y="682" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Blockchain state</text>
  </g><g>
    <rect x="560" y="520" width="480" height="120" rx="14" fill="#0B1B25" stroke="#7BC2A5" stroke-width="2"/>
    <rect x="560" y="520" width="5" height="120" rx="2.5" fill="#7BC2A5"/>
    
    <text x="800" y="587" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Matched or scoped exception</text>
  </g>
  <line x1="90" y1="842" x2="1510" y2="842" stroke="#34505C" stroke-width="1"/>
  <text x="90" y="872" fill="#91A6AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.8">DOCUMENTATION VISUAL / HUMAN-READABLE / SOURCE-BOUND</text>
