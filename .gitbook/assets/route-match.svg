<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Route Match</title>
  <desc id="desc">Network, asset identity, destination, and authority must resolve to the same admitted route.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10232D" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061018"/>
      <stop offset="1" stop-color="#081A24"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2F93A8"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".42"/>
  <circle cx="1440" cy="80" r="180" fill="#2F93A8" opacity=".07" filter="url(#soft)"/>
  <g>
    <text x="90" y="82" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3">SYSTEM VIEW / ROUTE-MATCH</text>
    <text x="90" y="150" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="650">Route Match</text>
    <text x="90" y="192" fill="#91A6AF" font-family="Inter, Arial, sans-serif" font-size="20">Network, asset identity, destination, and authority must resolve to the same admitted route.</text>
    <line x1="90" y1="222" x2="1510" y2="222" stroke="#34505C" stroke-width="1"/>
  </g>
  <path d="M 105 625 C 420 390, 1180 390, 1495 625" fill="none" stroke="#34505C" stroke-width="24" stroke-linecap="round"/><rect x="180" y="390" width="120" height="270" rx="60" fill="#0B1B25" stroke="#69D2E7" stroke-width="3"/>
      <circle cx="240" cy="444" r="14" fill="#69D2E7"/>
      <text x="240" y="508" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Network</text><rect x="460" y="312.21825406947977" width="120" height="270" rx="60" fill="#0B1B25" stroke="#69D2E7" stroke-width="3"/>
      <circle cx="520" cy="366.21825406947977" r="14" fill="#69D2E7"/>
      <text x="520" y="430.21825406947977" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Chain ID</text><rect x="740" y="280" width="120" height="270" rx="60" fill="#0B1B25" stroke="#69D2E7" stroke-width="3"/>
      <circle cx="800" cy="334" r="14" fill="#69D2E7"/>
      <text x="800" y="398" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Asset</text><text x="800" y="421" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">contract</text><rect x="1020" y="312.21825406947977" width="120" height="270" rx="60" fill="#0B1B25" stroke="#69D2E7" stroke-width="3"/>
      <circle cx="1080" cy="366.21825406947977" r="14" fill="#69D2E7"/>
      <text x="1080" y="430.21825406947977" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Destination</text><rect x="1300" y="390" width="120" height="270" rx="60" fill="#0B1B25" stroke="#7BC2A5" stroke-width="3"/>
      <circle cx="1360" cy="444" r="14" fill="#7BC2A5"/>
      <text x="1360" y="508" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Authority</text>
  <line x1="90" y1="842" x2="1510" y2="842" stroke="#34505C" stroke-width="1"/>
  <text x="90" y="872" fill="#91A6AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.8">DOCUMENTATION VISUAL / HUMAN-READABLE / SOURCE-BOUND</text>
</svg>