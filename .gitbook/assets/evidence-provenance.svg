<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Evidence and Provenance</title>
  <desc id="desc">Every claim resolves to a source, observation time, transformation, confidence, and version.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10232D" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061018"/>
      <stop offset="1" stop-color="#081A24"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2F93A8"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".42"/>
  <circle cx="1440" cy="80" r="180" fill="#2F93A8" opacity=".07" filter="url(#soft)"/>
  <g>
    <text x="90" y="82" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3">SYSTEM VIEW / EVIDENCE-PROVENANCE</text>
    <text x="90" y="150" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="650">Evidence and Provenance</text>
    <text x="90" y="192" fill="#91A6AF" font-family="Inter, Arial, sans-serif" font-size="20">Every claim resolves to a source, observation time, transformation, confidence, and version.</text>
    <line x1="90" y1="222" x2="1510" y2="222" stroke="#34505C" stroke-width="1"/>
  </g>
  <g>
    <rect x="90" y="305" width="328.75" height="145" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="90" y="305" width="5" height="145" rx="2.5" fill="#69D2E7"/>
    <text x="112" y="336" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">01</text>
    <text x="254.375" y="384.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Claim</text>
  </g><g>
    <rect x="453.75" y="305" width="328.75" height="145" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="453.75" y="305" width="5" height="145" rx="2.5" fill="#69D2E7"/>
    <text x="475.75" y="336" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">02</text>
    <text x="618.125" y="384.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Source</text>
  </g><g>
    <rect x="817.5" y="305" width="328.75" height="145" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="817.5" y="305" width="5" height="145" rx="2.5" fill="#69D2E7"/>
    <text x="839.5" y="336" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">03</text>
    <text x="981.875" y="384.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Observation time</text>
  </g><g>
    <rect x="1181.25" y="305" width="328.75" height="145" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="1181.25" y="305" width="5" height="145" rx="2.5" fill="#69D2E7"/>
    <text x="1203.25" y="336" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">04</text>
    <text x="1345.625" y="384.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Transformation</text>
  </g><g>
    <rect x="1181.25" y="525" width="328.75" height="145" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="1181.25" y="525" width="5" height="145" rx="2.5" fill="#69D2E7"/>
    <text x="1203.25" y="556" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">05</text>
    <text x="1345.625" y="604.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Confidence</text>
  </g><g>
    <rect x="817.5" y="525" width="328.75" height="145" rx="14" fill="#0B1B25" stroke="#7BC2A5" stroke-width="2"/>
    <rect x="817.5" y="525" width="5" height="145" rx="2.5" fill="#7BC2A5"/>
    <text x="839.5" y="556" fill="#7BC2A5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">06</text>
    <text x="981.875" y="604.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Versioned evidence</text>
  </g><path d="M 418.75 377.5 L 453.75 377.5" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M 782.5 377.5 L 817.5 377.5" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M 1146.25 377.5 L 1181.25 377.5" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M 1345.625 450 L 1345.625 525" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M 1181.25 597.5 L 1146.25 597.5" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/>
  <line x1="90" y1="842" x2="1510" y2="842" stroke="#34505C" stroke-width="1"/>
  <text x="90" y="872" fill="#91A6AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.8">DOCUMENTATION VISUAL / HUMAN-READABLE / SOURCE-BOUND</text>
