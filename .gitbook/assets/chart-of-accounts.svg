<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Chart of Accounts</title>
  <desc id="desc">Principal, rewards, reserves, fees, income, and corrections never share an economic identity.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10232D" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061018"/>
      <stop offset="1" stop-color="#081A24"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2F93A8"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".42"/>
  <circle cx="1440" cy="80" r="180" fill="#2F93A8" opacity=".07" filter="url(#soft)"/>
  <g>
    <text x="90" y="82" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3">SYSTEM VIEW / CHART-OF-ACCOUNTS</text>
    <text x="90" y="150" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="650">Chart of Accounts</text>
    <text x="90" y="192" fill="#91A6AF" font-family="Inter, Arial, sans-serif" font-size="20">Principal, rewards, reserves, fees, income, and corrections never share an economic identity.</text>
    <line x1="90" y1="222" x2="1510" y2="222" stroke="#34505C" stroke-width="1"/>
  </g>
  <g>
    <rect x="565" y="275" width="470" height="105" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="565" y="275" width="5" height="105" rx="2.5" fill="#69D2E7"/>
    
    <text x="800" y="334.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Canonical ledger</text>
  </g><path d="M 800 380 L 267.5 500" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><g>
    <rect x="110" y="500" width="315" height="105" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="110" y="500" width="5" height="105" rx="2.5" fill="#69D2E7"/>
    <text x="132" y="531" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">01</text>
    <text x="267.5" y="559.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Assets</text>
  </g><path d="M 800 380 L 622.5 500" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><g>
    <rect x="465" y="500" width="315" height="105" rx="14" fill="#0B1B25" stroke="#D7A75F" stroke-width="2"/>
    <rect x="465" y="500" width="5" height="105" rx="2.5" fill="#D7A75F"/>
    <text x="487" y="531" fill="#D7A75F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">02</text>
    <text x="622.5" y="559.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Customer liabilities</text>
  </g><path d="M 800 380 L 977.5 500" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><g>
    <rect x="820" y="500" width="315" height="105" rx="14" fill="#0B1B25" stroke="#D7A75F" stroke-width="2"/>
    <rect x="820" y="500" width="5" height="105" rx="2.5" fill="#D7A75F"/>
    <text x="842" y="531" fill="#D7A75F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">03</text>
    <text x="977.5" y="559.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Reward liabilities</text>
  </g><path d="M 800 380 L 1332.5 500" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><g>
    <rect x="1175" y="500" width="315" height="105" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="1175" y="500" width="5" height="105" rx="2.5" fill="#69D2E7"/>
    <text x="1197" y="531" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">04</text>
    <text x="1332.5" y="559.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Reserves</text>
  </g><path d="M 800 380 L 445 665" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><g>
    <rect x="287.5" y="665" width="315" height="105" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="287.5" y="665" width="5" height="105" rx="2.5" fill="#69D2E7"/>
    <text x="309.5" y="696" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">05</text>
    <text x="445" y="724.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Income</text>
  </g><path d="M 800 380 L 800 665" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><g>
    <rect x="642.5" y="665" width="315" height="105" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="642.5" y="665" width="5" height="105" rx="2.5" fill="#69D2E7"/>
    <text x="664.5" y="696" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">06</text>
    <text x="800" y="724.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Expenses</text>
  </g><path d="M 800 380 L 1155 665" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><g>
    <rect x="997.5" y="665" width="315" height="105" rx="14" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
    <rect x="997.5" y="665" width="5" height="105" rx="2.5" fill="#69D2E7"/>
    <text x="1019.5" y="696" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">07</text>
    <text x="1155" y="724.5" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Memorandum</text>
  </g>
  <line x1="90" y1="842" x2="1510" y2="842" stroke="#34505C" stroke-width="1"/>
  <text x="90" y="872" fill="#91A6AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.8">DOCUMENTATION VISUAL / HUMAN-READABLE / SOURCE-BOUND</text>
</svg>