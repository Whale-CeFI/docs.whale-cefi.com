<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Canonical Asset Identity</title>
  <desc id="desc">A display symbol is never enough to identify an asset or an accepted route.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10232D" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061018"/>
      <stop offset="1" stop-color="#081A24"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2F93A8"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".42"/>
  <circle cx="1440" cy="80" r="180" fill="#2F93A8" opacity=".07" filter="url(#soft)"/>
  <g>
    <text x="90" y="82" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3">SYSTEM VIEW / ASSET-IDENTITY</text>
    <text x="90" y="150" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="650">Canonical Asset Identity</text>
    <text x="90" y="192" fill="#91A6AF" font-family="Inter, Arial, sans-serif" font-size="20">A display symbol is never enough to identify an asset or an accepted route.</text>
    <line x1="90" y1="222" x2="1510" y2="222" stroke="#34505C" stroke-width="1"/>
  </g>
  <path d="M 315 270 H 1285 L 1320 302 L 1285 334 H 315 L 280 302 Z" fill="#102733" stroke="#2F93A8"/>
    <text x="800" y="310" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Network</text><path d="M 370 354 H 1230 L 1265 386 L 1230 418 H 370 L 335 386 Z" fill="#0B1B25" stroke="#2F93A8"/>
    <text x="800" y="394" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Chain ID</text><path d="M 425 438 H 1175 L 1210 470 L 1175 502 H 425 L 390 470 Z" fill="#102733" stroke="#2F93A8"/>
    <text x="800" y="478" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Contract or mint</text><path d="M 480 522 H 1120 L 1155 554 L 1120 586 H 480 L 445 554 Z" fill="#0B1B25" stroke="#2F93A8"/>
    <text x="800" y="562" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Decimals</text><path d="M 535 606 H 1065 L 1100 638 L 1065 670 H 535 L 500 638 Z" fill="#102733" stroke="#2F93A8"/>
    <text x="800" y="646" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Token behavior</text><path d="M 590 690 H 1010 L 1045 722 L 1010 754 H 590 L 555 722 Z" fill="#0B1B25" stroke="#7BC2A5"/>
    <text x="800" y="730" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Registry version</text>
  <line x1="90" y1="842" x2="1510" y2="842" stroke="#34505C" stroke-width="1"/>
  <text x="90" y="872" fill="#91A6AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.8">DOCUMENTATION VISUAL / HUMAN-READABLE / SOURCE-BOUND</text>
</svg>