      <text x="1377.6000000000001" y="528" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Reconciliation</text><text x="1377.6000000000001" y="554" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">zone</text>
