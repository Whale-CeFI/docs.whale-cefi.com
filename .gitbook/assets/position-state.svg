<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Position State Machine</title>
  <desc id="desc">Every transition has an authority, precondition, ledger effect, and evidence record.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10232D" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061018"/>
      <stop offset="1" stop-color="#081A24"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2F93A8"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".42"/>
  <circle cx="1440" cy="80" r="180" fill="#2F93A8" opacity=".07" filter="url(#soft)"/>
  <g>
    <text x="90" y="82" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="3">SYSTEM VIEW / POSITION-STATE</text>
    <text x="90" y="150" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="650">Position State Machine</text>
    <text x="90" y="192" fill="#91A6AF" font-family="Inter, Arial, sans-serif" font-size="20">Every transition has an authority, precondition, ledger effect, and evidence record.</text>
    <line x1="90" y1="222" x2="1510" y2="222" stroke="#34505C" stroke-width="1"/>
  </g>
  <circle cx="280" cy="500" r="86" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
      <text x="280" y="460" text-anchor="middle" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">01</text>
      <text x="280" y="505" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Draft</text><path d="M 370 500 L 398 550" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><circle cx="488" cy="550" r="86" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
      <text x="488" y="510" text-anchor="middle" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">02</text>
      <text x="488" y="555" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Reviewed</text><path d="M 578 550 L 606 500" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><circle cx="696" cy="500" r="86" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
      <text x="696" y="460" text-anchor="middle" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">03</text>
      <text x="696" y="505" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Active</text><path d="M 786 500 L 814 550" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><circle cx="904" cy="550" r="86" fill="#0B1B25" stroke="#69D2E7" stroke-width="2"/>
      <text x="904" y="510" text-anchor="middle" fill="#69D2E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">04</text>
      <text x="904" y="555" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Matured</text><path d="M 994 550 L 1022 500" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><circle cx="1112" cy="500" r="86" fill="#0B1B25" stroke="#D7A75F" stroke-width="2"/>
      <text x="1112" y="460" text-anchor="middle" fill="#D7A75F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">05</text>
      <text x="1112" y="505" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Redeeming</text><path d="M 1202 500 L 1230 550" stroke="#2F93A8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><circle cx="1320" cy="550" r="86" fill="#0B1B25" stroke="#7BC2A5" stroke-width="2"/>
      <text x="1320" y="510" text-anchor="middle" fill="#7BC2A5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">06</text>
      <text x="1320" y="555" text-anchor="middle" fill="#EAF1F3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Closed</text>
  <line x1="90" y1="842" x2="1510" y2="842" stroke="#34505C" stroke-width="1"/>
  <text x="90" y="872" fill="#91A6AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.8">DOCUMENTATION VISUAL / HUMAN-READABLE / SOURCE-BOUND</text>
</svg>